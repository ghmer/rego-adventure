version: "2"

run:
  timeout: 5m
  tests: true

linters:
  exclusions:
    paths:
      # npm dependencies (e.g. flatted) sometimes vendor Go packages
      # under node_modules; Go resolves them as module packages locally
      # even though they are not part of the repository. Never lint them.
      - node_modules
  enable:
    - govet
    - staticcheck
    - revive
    - errcheck
    - ineffassign
    - unused
    - gocyclo
    - funlen
    - lll
    - gosec
    - nilerr
    - errorlint
    - bodyclose
    - noctx
    - testifylint
    - misspell
    - nolintlint
    - modernize
  settings:
    funlen:
      lines: 85
      statements: 75
    lll:
      line-length: 125
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports
