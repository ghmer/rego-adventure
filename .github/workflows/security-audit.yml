name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday
  push:
    paths:
      - 'frontend/adventure/package.json'
  pull_request:
    paths:
      - 'frontend/adventure/package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.7.0'

      # Reproducible install from the committed lockfile; --ignore-scripts
      # prevents dependency lifecycle scripts from executing in CI.
      - name: Install dependencies
        run: cd frontend/adventure && npm ci --ignore-scripts
      
      - name: Run security audit
        run: cd frontend/adventure && npm audit