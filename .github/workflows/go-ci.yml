name: Go CI

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      # backend/quest/rules_parity_test.go compares the server's validation
      # against the quest editor's rule list and fixture packs, and
      # cmd/doccite checks the file:line citations in state-machines.md
      # against the sources.
      - "docu/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "docu/**"
      - ".github/workflows/go-ci.yml"

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Run tests
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  clone-gate:
    runs-on: ubuntu-latest
    name: Clone gate
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      # Production code only: Go and JavaScript test files are excluded
      # (table-driven tests legitimately repeat request scaffolding), and
      # the byte-golden fixtures under testdata are generated data, not
      # code. Any clone at the 60-token threshold fails the job.
      - name: Reject duplicated production code
        run: |
          npx --yes jscpd@4.0.5 --min-tokens 60 --threshold 0 --reporters console \
            --ignore "**/*_test.go,**/*.test.js,**/*.test.go,**/testdata/**" \
            backend cmd main.go frontend/adventure/src docu/quest-editor
