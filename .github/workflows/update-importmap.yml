name: Update importmap for Dependabot PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "frontend/adventure/package.json"

permissions:
  contents: write
  pull-requests: write

# Two Dependabot PRs racing on `git push` would fail or interleave commits;
# synchronize events supersede each other, so cancel rather than queue.
concurrency:
  group: importmap-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  importmap:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out Trusted Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: trusted-base

      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: pr-head

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      # npm resolves the lockfile refresh the vendoring is pinned to.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      - name: Refresh the vendored libraries and the import map
        run: |
          npm install --package-lock-only --ignore-scripts
          go run ${GITHUB_WORKSPACE}/trusted-base/cmd/vendorgen \
            -pkg frontend/adventure/package.json
          go run ${GITHUB_WORKSPACE}/trusted-base/cmd/importmapgen/main.go \
            -pkgPath frontend/adventure/package.json \
            -indexPath frontend/adventure/index.html \
            -manifest frontend/adventure/vendor/manifest.json
        working-directory: pr-head

      - name: Commit and push if changed
        working-directory: pr-head
        run: |
          # package.json carries the PR version, so only the generated
          # files can drift: lockfile refresh, vendored tree, import map.
          if git diff --quiet -- frontend/adventure; then
            echo "No changes to the imported surface"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add frontend/adventure
          git commit -m "chore: update index.html and vendored libraries"
          git push
