name: Build and push container images (multi-arch)

on:
  push:
    tags: ["v*", "v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Lint frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      # Ephemeral, pinned toolchain: installed on the runner only
      # (--no-save leaves package.json untouched), never committed.
      - name: Install pinned eslint toolchain
        run: npm install --no-save --no-audit --no-fund eslint@10.10.0 @eslint/js@10.0.1 globals@17.12.0
        working-directory: frontend/adventure

      - name: Run eslint
        run: npx eslint src
        working-directory: frontend/adventure

  frontend-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Test frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      # Ephemeral, pinned toolchain: installed on the runner only
      # (--no-save leaves package.json untouched), never committed.
      - name: Install pinned vitest toolchain
        run: npm install --no-save --no-audit --no-fund vitest@5.0.0 happy-dom@20.14.3
        working-directory: frontend/adventure

      - name: Run vitest
        run: npx vitest run
        working-directory: frontend/adventure

  build-and-push:
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    # Image builds and pushes only make sense for tag pushes; on
    # workflow_dispatch the lint/test jobs still validate the ref. Without
    # this gate the push step would run with an empty tag and fail late.
    if: github.ref_type == 'tag'
    name: Build and push image (linux/amd64, linux/arm64)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'

      - name: Run tests
        run: go test -v ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          buildkitd-flags: --debug

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name and tag
        id: set-image
        run: |
          # Image name in GitHub Container Registry
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "image-name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

          # If this is a tag push, use the tag name
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "Detected tag push: ${TAG_NAME}"
            
            # Build both tag and latest
            TAGS="${IMAGE_NAME}:${TAG_NAME},${IMAGE_NAME}:latest"
            echo "Building: ${TAG_NAME} and latest"
            
            echo "IMAGE_TAG=${TAGS}" >> $GITHUB_ENV
            echo "image-tag=${TAGS}" >> $GITHUB_OUTPUT
          else
            echo "This workflow is only intended for tag pushes. Skipping." >&2
            exit 0
          fi

      - name: Build and push (multi-platform)
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.set-image.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
