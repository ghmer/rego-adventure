name: Frontend CI

on:
  push:
    branches: [main]
    # Tags are included so every published image build (docker-build,
    # which no longer carries frontend jobs) is gated by lint, tests
    # and the import-map sync check even when the tag is cut from a
    # non-main ref.
    tags:
      - "v*"
      - "v*.*.*"
    paths:
      - "frontend/adventure/**"
      - "docu/quest-editor/**"
      - "docu/qa/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/adventure/**"
      - "docu/quest-editor/**"
      - "docu/qa/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      # Ephemeral, pinned toolchain: installed on the runner only
      # (--no-save leaves package.json untouched), never committed.
      - name: Install pinned eslint toolchain
        run: npm install --no-save --no-audit --no-fund eslint@10.10.0 @eslint/js@10.0.1 globals@17.12.0
        working-directory: frontend/adventure

      - name: Run eslint
        run: npx eslint src
        working-directory: frontend/adventure

  test:
    runs-on: ubuntu-latest
    name: Test frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      # Ephemeral, pinned toolchain: installed on the runner only
      # (--no-save leaves package.json untouched), never committed.
      - name: Install pinned vitest toolchain
        run: npm install --no-save --no-audit --no-fund vitest@5.0.0 happy-dom@20.14.3
        working-directory: frontend/adventure

      - name: Run vitest
        run: npx vitest run
        working-directory: frontend/adventure

  quest-editor-rules:
    runs-on: ubuntu-latest
    name: Test quest editor rules
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      # The quest editor is a static tool with no dependencies of its own, so
      # its rule tests run on Node's built-in test runner. The editor's DOM
      # behaviour is covered by the checklist in docu/quest-editor/QA.md.
      - name: Run quest editor rule tests
        run: node --test docu/quest-editor/

  importmap-sync:
    runs-on: ubuntu-latest
    name: Import map tracks package.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      # The import map in index.html and the synced cdnjs links must be
      # exactly what cmd/importmapgen derives from package.json. Manual
      # dependency bumps bypass the update-importmap PR workflow, so this
      # check fails a PR whose index.html has drifted instead of letting
      # the versions diverge silently.
      - name: Regenerate import map and fail on drift
        run: |
          go run ./cmd/importmapgen/main.go
          if ! git diff --exit-code -- frontend/adventure/index.html; then
            echo "::error::frontend/adventure/index.html is out of sync with frontend/adventure/package.json."
            echo "Regenerate it with: go run ./cmd/importmapgen/main.go"
            git diff -- frontend/adventure/index.html
            exit 1
          fi

  browser-qa:
    runs-on: ubuntu-latest
    name: Browser QA suites
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      # The QA suites resolve Playwright from the machine rather than as a
      # declared dependency (docu/qa/qa-lib.cjs), so a pinned install at the
      # repository root puts it into their direct search path. The next step
      # fails the job when the two pins drift, so a qa-lib change without
      # the matching workflow update cannot pass.
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.65.0
          grep -qx "const PLAYWRIGHT_VERSION = '1.65.0';" docu/qa/qa-lib.cjs || {
            echo "::error::docu/qa/qa-lib.cjs no longer pins Playwright 1.65.0; update the browser-qa install step in the same change."
            exit 1
          }
          npx playwright install --with-deps chromium

      - name: Run QA suites
        run: |
          for suite in cli-qa dialog-qa editor-qa save-compat session-qa spa-qa; do
            node "docu/qa/$suite.cjs"
          done
