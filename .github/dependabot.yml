version: 2
updates:
  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend/adventure"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # The shipped surface moves alone: the browser libraries share one PR
      # (they feed one import map), so a broken toolchain bump cannot hold
      # back a shipped-surface fix and the reverse.
      cdn-libs:
        patterns:
          - "canvas-confetti"
          - "dompurify"
          - "driver.js"
          - "marked"
          - "oidc-client-ts"
          - "yace"
      # Everything else is CI tooling; unknown packages default to this
      # group, so nothing added later silently escapes updates.
      toolchain:
        patterns:
          - "*"
        exclude-patterns:
          - "canvas-confetti"
          - "dompurify"
          - "driver.js"
          - "marked"
          - "oidc-client-ts"
          - "yace"
  
  # Go dependencies
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      go-all:
        patterns:
          - "*"
  
  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
  
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      actions-all:
        patterns:
          - "*"